[package]
name = "fieldbook-dotcmd"
version = "0.1.0"
edition = "2021"
description = "Fieldbook authoring/orchestration dot commands (.fb, .entry, .run) as a pluggable ducklink CLI component"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41"
wit-bindgen-rt = "0.41"

[package.metadata.component]
package = "duckdb:dotcmd"

[package.metadata.component.target]
path = "./wit"
world = "duckdb:dotcmd/dotcmd"
