[package]
name = "timescale_time_bucket-component"
version = "2.19.0"
edition = "2021"
description = """
timescale_time_bucket: TimescaleDB's `time_bucket`, `time_bucket_range`, and
`time_bucket_gapfill` scalars — the smallest slice of the timescaledb surface,
the canonical time-series bucketing primitives. Vendored from the
compose:dynlink per-sub bridge (`timescale_time_bucket-ducklink-bridge`) — a
thin wasm32-wasip2 component that imports `compose:dynlink/linker@0.1.0` and
routes each scalar dispatch to the resident `timescale_core-composed` provider
(the vendored timescaledb-core-provider-composed.wasm) via a CBOR envelope.
Exports the canonical `duckdb:extension@4.0.0` guest + callback-dispatch pair.
Upstream: TimescaleDB 2.19.0.
"""
license = "Apache-2.0"
publish = false

# Self-contained workspace so this crate builds standalone via
# `cargo build --target wasm32-wasip2 --release` without polluting the outer
# ducklink workspace resolver (mirrors extensions/talib-component's pattern;
# the outer Cargo.toml excludes this dir).
[workspace]
members = ["."]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.41", features = ["macros"] }
wit-bindgen-rt = { version = "0.41", features = ["bitflags"] }
ciborium = { version = "0.2", default-features = false }
ciborium-io = { version = "0.2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_bytes = { version = "0.11", default-features = false, features = ["alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
