[package]
name = "ducklink-scalars-component"
version = "0.1.0"
edition = "2021"
description = """
Ducklink control-plane scalars (ducklink_version, ducklink_help) as a
loadable wasm component. Ships the two always-available scalars committed
in ducklink-extension's STABILITY.md § 1.1 so the workspace host satisfies
the cross-host conformance suite. Thin shim: all logic lives in
ducklink-scalars-core (datalink).
"""
license = "MIT"
publish = false

[lib]
name = "ducklink_scalars"
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41"
wit-bindgen-rt = "0.41"
ducklink-scalars-core = { path = "../../../datalink/extensions/ducklink-scalars-core" }
datalink-extcore = { path = "../../../datalink/crates/datalink-extcore" }

[package.metadata.component]
package = "duckdb:extension"

[package.metadata.component.target]
path = "./wit"
world = "duckdb:extension/duckdb-extension"
