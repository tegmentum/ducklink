[package]
name = "cache-component"
version = "0.1.0"
edition = "2021"
description = """
Ducklink cache wasm engine — the wasm-side counterpart to the native
duckdb-cache extension. Registers the two `cache` scalar overloads
(`cache(uri)` and `cache(config_json, uri)`) that return a `file://`
URI pointing at a locally cached copy of the requested bytes. On-disk
layout (content-addressed `objects/<hh>/<rest>` + sqlite `metadata.db`)
is byte-compatible with duckdb-cache, so a database migrated between
the two arms sees the same cache. Persistent metadata rides
`sqlite:extension/spi` (imported from sqlite-wasm); the resolver + all
byte-level I/O live in this shim, with only the neutral config/policy
parser + the `declare!`-driven scalar table pulled from
`cache-core` in datalink.
"""
license = "MIT"
publish = false

[lib]
name = "cache"
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41"
wit-bindgen-rt = "0.41"
# Shared, DB-agnostic core (declare!-driven surface + config parsing).
cache-core = { path = "../../../datalink/extensions/cache-core" }
# Neutral value model + shared columnar bridge helpers.
datalink-extcore = { path = "../../../datalink/crates/datalink-extcore" }
# HTTP fetch runs over `wasi:http/outgoing-handler` — the host's
# wasmtime-wasi-http linker satisfies the transport (TLS included), the
# same wiring `component:s3-wasm` consumes. No rustls / no CA bundle
# lives in the wasm; the WIT world imports `wasi:http/{types,outgoing-handler}`
# and the generated bindings drive it. See `src/lib.rs::fetch_http_via_wasi`.
# sha2 for content-addressed publish. Matches cache-core's transitive
# choice, so the workspace unifies to a single `sha2` build.
sha2 = "0.10"
# Lenient JSON for s3-specific config fields (endpoint, region,
# version_id, anonymous). cache-core's `Config::from_json` uses
# `#[serde(deny_unknown_fields)]`, so the s3 backend parses its own
# fields off `serde_json::Value` before handing the cache-core knobs
# (name, policy, sha256, ttl) back through the normal path.
serde_json = { version = "1", default-features = false, features = ["std"] }

[package.metadata.component]
package = "duckdb:extension"

[package.metadata.component.target]
path = "./wit"
world = "duckdb:extension/duckdb-extension-cache"

[package.metadata.component.target.dependencies]
"sqlite:extension" = { path = "wit/deps/sqlite-extension.wit" }
"component:s3-wasm" = { path = "wit/deps/s3-wasm.wit" }
"wasi:http" = { path = "wit/deps/http" }
"wasi:io" = { path = "wit/deps/io" }
"wasi:clocks" = { path = "wit/deps/clocks" }
