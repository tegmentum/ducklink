# DuckDB community-extensions manifest.
extension:
  name: aba
  description: US ABA / bank routing-number checks (validate, FRB district, FRB region)
  version: 0.1.0
  language: Rust
  build: cargo
  license: MIT
  maintainers:
    - tegmentum
  requires_toolchains: "rust;python3"

repo:
  github: tegmentum/aba-extension
  ref: v0.1.0

docs:
  hello_world: |
    LOAD aba;
    SELECT aba_validate('021000021');           -- true (Bank of NY)
    SELECT aba_frb_district('322271627');       -- 12 (San Francisco)
    SELECT aba_fed_region('322271627');         -- San Francisco
  extended_description: |
    Three scalar functions for validating and inspecting US ABA (American
    Bankers Association) routing transit numbers:

      * aba_validate(text) -> boolean
          9-digit weighted checksum (3,7,1,3,7,1,3,7,1). Returns FALSE for
          malformed or non-9-digit input.
      * aba_frb_district(text) -> bigint
          Federal Reserve district (1..12; 0 for U.S. Treasury). Returns
          NULL for an unrecognized prefix.
      * aba_fed_region(text) -> text
          District name (e.g. "New York", "San Francisco"). NULL for an
          unrecognized prefix.

    Shares its pure-logic core (`aba-core`) with the WASM `aba` component
    distributed via the ducklink extension. This native build runs at
    DuckDB's vectorized-executor speed (~1 ns/row), suitable for
    validating routing numbers over large row sets. Use ducklink's WASM
    `aba` when sandboxing / portability / dynamic-load matter more than
    raw throughput.
