# Native DuckDB community extension for ABA routing-number validation.
# Same aba-core logic ducklink's WASM aba component uses, wrapped as a
# native duckdb-rs extension. See ducklink-extension's
# docs/dual-build-native-and-wasm.md for the pattern.
[package]
name = "aba-extension"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "US ABA routing-number checks for DuckDB (native)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "aba"

[features]
default = ["loadable"]
duckdb-api = ["dep:duckdb", "duckdb/vscalar"]
loadable = [
    "duckdb-api",
    "duckdb/loadable-extension",
    "dep:libduckdb-sys",
    "libduckdb-sys/loadable-extension",
]
bundled = ["duckdb-api", "duckdb/bundled"]

[dependencies]
# Same pure-logic crate the WASM component uses. Single source of truth.
aba-core = { path = "../../../datalink/extensions/aba-core" }

# DuckDB C Extension API. Pinned to the community-extensions CI's DuckDB version.
duckdb = { version = "1.10504.0", optional = true, default-features = false }
libduckdb-sys = { version = "1.10504.0", features = ["loadable-extension"], optional = true }

[dev-dependencies]
criterion = "0.5"


[profile.release]
lto = true
strip = true

[workspace]
