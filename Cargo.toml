[workspace]
# ADR-consolidation-2026-09-24: the WebAssembly implementation
# (ducklink-cli, ducklink-loader, ~220 extension components,
# handlers/echo-handler) moved to ~/git/wasmos/ducklink/ as a
# nested workspace of wasmos. This workspace now contains only
# the native-with-embedded-wasmtime side: ducklink-runtime,
# ducklink-host, storage-boundary-test, table-stream-boundary-test,
# tools/catalog-sig-extract, plus the native-extension submodule
# and wit/, bridges/, conformance/, python-sdk/.
#
# The 4 previously-excluded nested-workspace extensions
# (talib-component, postgis_core-component,
# mobilitydb_temporal_core-component, timescale_time_bucket-component)
# moved with extensions/*; their exclude entries are gone.
members = [
    "crates/ducklink-runtime",
    "crates/ducklink-host",
    "crates/storage-boundary-test",
    "crates/table-stream-boundary-test",
    "tools/catalog-sig-extract",
]
exclude = [
    # The native ducklink extension is a git submodule with its own
    # `runtime/` crate ALSO named `ducklink-runtime`. Left in the workspace
    # it collides with `crates/ducklink-runtime` (both packages have the
    # same name, so the workspace member wins and the submodule's engine
    # code sees a wrong-version bindgen). It has its own `[workspace]` +
    # Cargo.lock and builds standalone: `cargo build --manifest-path
    # native-extension/ducklink/Cargo.toml`.
    "native-extension/ducklink",
]

resolver = "2"

# Unify wasmos-runtime-api across the workspace.
#
# `datalink-dynlink-wasmos` is a git dep (pinned at tag v0.2.0 in
# crates/ducklink-host/Cargo.toml) that itself pulls
# `wasmos-runtime-api` from the wasmos repo at tag v0.3.2. Ducklink's
# own crates depend on `wasmos-runtime-api` via the local sibling
# checkout (`../wasmos/runtime/api`). Without a patch, cargo sees two
# distinct sources for the same crate and the `Runtime` trait
# instantiated by each side is a different type — so
# `WasmtimeV48Runtime` (built against the local api) does not
# `impl Runtime` from the git-tag api, and `install_host_imports`
# returns a `HostImports` from the wrong type universe. Redirect the
# git source to the sibling checkout so both sides see the same
# `wasmos-runtime-api` crate.
[patch."https://github.com/tegmentum/wasmos.git"]
wasmos-runtime-api = { path = "../wasmos/runtime/api" }
wasmos-runtime-wasmtime-v48 = { path = "../wasmos/runtime/wasmtime/v48" }
