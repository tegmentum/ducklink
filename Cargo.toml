# talib-component carries its own `[workspace]` table (an independent lockfile —
# see its Cargo.toml) so it is built standalone via `cargo component build`, not
# as a member of this workspace. Exclude it explicitly so cargo does not treat
# the nested manifest as a second workspace root.
#
# The compose:dynlink per-sub bridge extensions (postgis_core / mobilitydb_temporal_core /
# timescale_time_bucket) follow the same pattern: each vendors an auto-generated
# ~25k-line dispatch shim (regenerated by `sqlink-shim-codegen --dynlink`, see
# ~/git/bridges/per-sub/) whose deps (ciborium/serde `default-features = false` + `alloc`)
# collide with the outer workspace resolver's feature unification. Each carries its own
# `[workspace]` table + Cargo.lock and builds standalone via
# `cargo build --target wasm32-wasip2 --release`.
exclude = [
    "extensions/talib-component",
    "extensions/postgis_core-component",
    "extensions/mobilitydb_temporal_core-component",
    "extensions/timescale_time_bucket-component",
]

resolver = "2"
