[package]
name = "ducklink-host"
version = "0.1.0"
edition = "2021"

[dependencies]
# The reusable wasm-component-loading engine (being extracted from this crate).
ducklink-runtime = { path = "../ducklink-runtime" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
# Path B closure Phase 6 (2026-09-22): direct wasmtime / wasmtime-wasi /
# wasmtime-wasi-http Cargo deps RETIRED. The wasmtime-shaped types
# ducklink-host still names (Component, Engine, WasiCtx et al.) are
# reached through the ducklink-runtime re-exports
# (`ducklink_runtime::{ComponentHandle, EngineHandle, wasi::*}`).
# The wasmtime crate arrives transitively through ducklink-runtime;
# `cargo tree -p ducklink-host --edges no-normal --depth 2 | grep wasmtime`
# is expected to show only transitive edges after this landing.
# Tiered Virtual Memory: host-owned regions back DuckDB's >4 GiB spill tier.
# tvm-core is wasmtime-free; the manager/bytes host traits are implemented in
# this crate against this host's bindgen. Sourced via a pinned git rev of
# tvm-wasm (not a local path) so ducklink builds standalone AND so ChimeraDB's
# in-process build (which links ducklink-host + sqlink-host) resolves a SINGLE
# tvm-core source — sqlink-host pins the same rev. See chimeradb/PLAN-inprocess.md PR1.
tvm-core = { git = "https://github.com/tegmentum/tvm-wasm.git", tag = "v0.1.0" }
# TLS for `ducklink serve` (the httpd). Blocking rustls over the accept
# loop's TcpStream; rcgen mints the --tls-self-signed cert. Mirrors the
# sqlite-wasm-httpd stack.
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.13"
# Parse the structured `{status, body, ctype}` response a wasm handler returns,
# and the duckstream replicator's state.json sidecar.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# duckstream MVP (native-host checkpoint-snapshot replication to S3): blocking
# HTTP transport over rustls (HTTPS), lz4 snapshot compression, and the SigV4
# signing primitives (hmac/sha2/hex) reused by the `sigv4` module copied verbatim
# from the wasm s3fs transport.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "webpki-roots", "http2"] }
lz4_flex = "0.11"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Shared content-addressed-storage core: the BlobBackend trait + the
# trust-gated CompileCache. Used here to HMAC-authenticate the precompiled
# `.cwasm` (a `.cwasm` deserializes to runnable machine code, so it must be
# trusted). compose-core is wasmtime-free and sqlite-free.
compose-core = { git = "https://github.com/tegmentum/webassembly-component-orchestration.git", tag = "v0.1.0" }
# Ergonomic error enum for the sub-ext loader (Phase D). The rest of the
# crate uses anyhow at the boundary; internally SubExtError is a `thiserror`
# enum so callers can pattern-match on `SubExtError::PlanMissing` vs a compose
# failure without stringly parsing.
thiserror = "1"
# Home-dir resolution for the per-machine HMAC key + FsBlobStore cache root.
dirs = "5"
# Shared, db-agnostic crates (also consumed by the sqlink host). datalink is
# PUBLIC. These are HOST-only deps; ducklink-runtime (the vendored extension
# runtime) is untouched, so no extension re-vendor is implied.
#   - datalink-policy: canonical capability-grant types. The coarse
#     DUCKLINK_NETWORK_GRANT env is compiled into a canonical Policy via an
#     adapter (allow-all / deny-all / per-name); behavior is unchanged.
#     (datalink-prefix was retired here in commit a048b7a — workspace now
#     adopts the extension v5.0.0 prefix.name model via ducklink_prefix.)
datalink-policy = { git = "https://github.com/tegmentum/datalink.git", tag = "v0.2.0" }
# AT5 write-intercept fast path (Bug 4c): when an ATTACH names a sqlitewasm
# TYPE against a local file DSN, the host opens a NATIVE file-backed
# rusqlite connection alongside the wasm-side and replays each dispatched
# INSERT/UPDATE/DELETE against that connection, bypassing storage-write-
# dispatch. Under the wasmos sync_dispatch path each cross-component call
# is ~15ms; the previous Bug 4b (sqlite-lib + wasivfs) path made every
# INSERT round-trip storage-write-dispatch -> sqlite-lib SPI -> wasivfs,
# so 10k INSERTs took 150-160s. Native rusqlite drops per-INSERT to sub-ms
# and pushes the 10k-INSERT stress regression well under its 60s budget.
# See `AttachedForeignCatalog::native_write_conn` + `intercept_write` for
# the wiring.
rusqlite = { version = "0.40", features = ["bundled"] }

# ADR-0029 Phase 6.2.d.3 — moved from dev-deps to a regular dep so
# `src/dotcmd_wasmos.rs` can register the `duckdb:dotcmd/spi` handler
# on production install paths, not just tests.
#
# Switched from `git tag v0.3.2` to a local path checkout so ducklink
# and wasmos can co-evolve during the Phase-2+ migration that lifts
# the remaining ~23k lines of direct-wasmtime code onto
# wasmos-runtime-api. Sibling-clone convention — same as this repo's
# other `~/git/*` path deps. The pinned git tag can return once the
# migration lands and wasmos cuts a release that carries every API
# ducklink-host needs.
wasmos-runtime-api    = { path = "../../../wasmos/runtime/api" }
# The runtime facade. `wasmtime-lts` (default) resolves to the v48
# adapter — matches ducklink-host's existing wasmtime 48 pin. Regular
# dep (was previously dev-only) so Phase 2 source rewrites can point
# at it directly rather than importing it conditionally.
wasmos-runtime-select = { path = "../../../wasmos/runtime/selector", features = ["wasmtime-lts"] }
# The v48 adapter itself, direct-deped so consumer code can reach
# the ADR-0029 §27 escape-hatch modules (`sync_bridge`,
# `sync_bridge_resource`, `sync_export_bridge`, `async_bridge`).
# `wasmos-runtime-select` only re-exports `SelectedRuntime` — not
# the adapter's escape-hatch surface — so Path-A migrations that
# retire `wasmtime::component::bindgen!` sites while keeping direct
# wasmtime types (see `docs/wasmos-migration-recipe.md`) need this
# in addition to the select facade.
wasmos-runtime-wasmtime-v48 = { path = "../../../wasmos/runtime/wasmtime/v48", features = ["sync-facade"] }
# Path B follow-up (2026-09-22): promoted from dev-deps to a regular
# dep so DotcmdRegistry::load_one can install the
# `compose:dynlink/linker` host imports on the wasmos-native path via
# `datalink_dynlink_wasmos::install_host_imports`. A process-global
# wasmos-native ProviderRegistry (`dotcmd_wasmos_provider_registry()`)
# is now the SOLE compose:dynlink provider registry consumed by
# ducklink-host — dot-commands, the extension load path, and
# `SubExtLoader` all resolve through it. The sibling wasmtime-shaped
# `dynlink_provider_registry()` retired in step 5 (2026-09-22).
datalink-dynlink-wasmos = { git = "https://github.com/tegmentum/datalink.git", tag = "v0.2.0" }
# Async runtime + bytes/async-trait are needed at library level too
# (were dev-only until 2026-09-22): datalink_dynlink_wasmos's
# `ProviderRegistry::register_provider_with_preopens` is `async fn`
# so DotcmdRegistry populates the wasmos-native registry from
# DUCKLINK_PROVIDERS through a process-owned tokio runtime, and the
# ResidentBackend's `Bytes` payload type on the invoke path crosses
# our lib surface too.
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
# wasmos-runtime-api + wasmos-runtime-select moved to regular deps
# above (local path) so production code and tests share one source
# of truth during the Phase-2+ direct-wasmtime → wasmos migration.
arrow-ipc = { version = "53", default-features = false }
arrow-array = { version = "53", default-features = false }
# PoC for the nested-exec Direction-1 §6 wasmtime re-entrancy experiment:
# a hand-rolled minimal wasm module (via wat) is enough to prove/refute the
# memo's claim that wasmtime rejects re-entering a store from a host callback.
wat = "1"
# AT5 sqlitewasm tests use rusqlite to sanity-check the underlying SQLite
# file from native code after the wasm-side writes complete (see
# tests/test_at5_read_sqlitewasm.rs, test_at5_write_sqlitewasm.rs,
# test_at5_bug4_incremental_writeback.rs). rusqlite is also a regular dep
# above (Bug 4c write fast path) so the two share one source of truth.

[[bin]]
name = "ducklink"
path = "src/bin/ducklink.rs"
