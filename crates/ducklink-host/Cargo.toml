[package]
name = "ducklink-host"
version = "0.1.0"
edition = "2021"

[dependencies]
# The reusable wasm-component-loading engine (being extracted from this crate).
ducklink-runtime = { path = "../ducklink-runtime" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
wasmtime = { version = "48.0.0", features = ["component-model", "cache"] }
wasmtime-wasi = "48.0.0"
# wasi:http host imports (types + outgoing-handler @0.2.9). Required because the
# composed cache.wasm now imports wasi:http via the s3-wasm HTTPS transport
# (commit d2b8870); without this the linker rejects it with "matching
# implementation was not found". Same version as wasmtime.
# `add_only_http_to_linker_sync` is called AFTER `wasmtime_wasi::p2::
# add_to_linker_sync` at each host store-state linker site to avoid double-add.
wasmtime-wasi-http = "48.0.0"
# Tiered Virtual Memory: host-owned regions back DuckDB's >4 GiB spill tier.
# tvm-core is wasmtime-free; the manager/bytes host traits are implemented in
# this crate against this host's bindgen. Sourced via a pinned git rev of
# tvm-wasm (not a local path) so ducklink builds standalone AND so ChimeraDB's
# in-process build (which links ducklink-host + sqlink-host) resolves a SINGLE
# tvm-core source — sqlink-host pins the same rev. See chimeradb/PLAN-inprocess.md PR1.
tvm-core = { git = "https://github.com/tegmentum/tvm-wasm.git", rev = "6f3bae38fad4addd4de1837ab151f4ac871d1dd4" }
# TLS for `ducklink serve` (the httpd). Blocking rustls over the accept
# loop's TcpStream; rcgen mints the --tls-self-signed cert. Mirrors the
# sqlite-wasm-httpd stack.
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.13"
# Parse the structured `{status, body, ctype}` response a wasm handler returns,
# and the duckstream replicator's state.json sidecar.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# duckstream MVP (native-host checkpoint-snapshot replication to S3): blocking
# HTTP transport over rustls (HTTPS), lz4 snapshot compression, and the SigV4
# signing primitives (hmac/sha2/hex) reused by the `sigv4` module copied verbatim
# from the wasm s3fs transport.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "webpki-roots", "http2"] }
lz4_flex = "0.11"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Shared content-addressed-storage core: the BlobBackend trait + the
# trust-gated CompileCache. Used here to HMAC-authenticate the precompiled
# `.cwasm` (a `.cwasm` deserializes to runnable machine code, so it must be
# trusted). compose-core is wasmtime-free and sqlite-free.
compose-core = { git = "https://github.com/tegmentum/webassembly-component-orchestration.git", rev = "416226921cc166e98016f534a73bd6c9b7dcb33c" }
# Ergonomic error enum for the sub-ext loader (Phase D). The rest of the
# crate uses anyhow at the boundary; internally SubExtError is a `thiserror`
# enum so callers can pattern-match on `SubExtError::PlanMissing` vs a compose
# failure without stringly parsing.
thiserror = "1"
# Home-dir resolution for the per-machine HMAC key + FsBlobStore cache root.
dirs = "5"
# Shared, db-agnostic crates (also consumed by the sqlink host). datalink is
# PUBLIC. These are HOST-only deps; ducklink-runtime (the vendored extension
# runtime) is untouched, so no extension re-vendor is implied.
#   - datalink-policy: canonical capability-grant types. The coarse
#     DUCKLINK_NETWORK_GRANT env is compiled into a canonical Policy via an
#     adapter (allow-all / deny-all / per-name); behavior is unchanged.
#     (datalink-prefix was retired here in commit a048b7a — workspace now
#     adopts the extension v5.0.0 prefix.name model via ducklink_prefix.)
datalink-policy = { git = "https://github.com/tegmentum/datalink.git", rev = "3175f1f3e29e96cdb22ad64a6c26627111dff364" }
# Bug 4b: the host-side rusqlite dep is gone. sqlitewasm now self-persists
# through wasivfs (sqlite-lib composed in via `wac plug`), so the host never
# re-opens the DSN file itself — writes cross the wasm boundary, hit the
# extension's SPI, and wasivfs performs the wasi:filesystem writes under the
# ducklink host's preopens (`attach_sqlitewasm_preopens`). See
# `at5_write_back`'s writes_persist_directly short-circuit. The AT5 write
# tests still keep rusqlite as a dev-dep to sanity-check the underlying
# SQLite file from native code after the wasm-side writes complete.

[dev-dependencies]
tempfile = "3"
# ADR-0029 Phase 6.2.d.1 dev-deps: the DynState-migration integration
# test (tests/compose_dynlink_dlopen.rs) drives datalink-dynlink-wasmos
# through the wasmos runtime abstraction end-to-end. Pinned to
# wasmos main tip at the time of the migration; bump when the abstraction
# grows. datalink-dynlink-wasmos is a peer-repo git dep at the datalink
# main rev that ships it (6fbb890+).
datalink-dynlink-wasmos = { git = "https://github.com/tegmentum/datalink.git", rev = "00fd3e73a63d8ee32b7153c8c4971145e0ba3ea4" }
wasmos-runtime-api = { git = "https://github.com/tegmentum/wasmos.git", rev = "571220d64e765d90cb1b7036c04c7fd6cd6b2911" }
wasmos-runtime-select = { git = "https://github.com/tegmentum/wasmos.git", rev = "571220d64e765d90cb1b7036c04c7fd6cd6b2911", features = ["wasmtime-lts"] }
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
arrow-ipc = { version = "53", default-features = false }
arrow-array = { version = "53", default-features = false }
# PoC for the nested-exec Direction-1 §6 wasmtime re-entrancy experiment:
# a hand-rolled minimal wasm module (via wat) is enough to prove/refute the
# memo's claim that wasmtime rejects re-entering a store from a host callback.
wat = "1"
# AT5 sqlitewasm tests use rusqlite to sanity-check the underlying SQLite
# file from native code after the wasm-side writes complete (see
# tests/test_at5_read_sqlitewasm.rs, test_at5_write_sqlitewasm.rs,
# test_at5_bug4_incremental_writeback.rs). The main host does NOT depend on
# rusqlite anymore (Bug 4b — sqlitewasm self-persists via wasivfs).
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "ducklink"
path = "src/bin/ducklink.rs"
