[package]
name = "ducklink-runtime"
version = "0.1.0"
edition = "2021"
description = "Reusable wasm-component-loading engine shared by the ducklink host and the native-DuckDB ducklink extension"
license = "MIT"
publish = false

[dependencies]
# The wasm engine. crates.io 45.0.1 so the generated `duckdb:extension`
# bindings are ABI-identical across both directions, and so this matches the
# sqlink host + the webassembly-component-orchestration framework (which is on
# 45.0.1), letting ducklink later reuse the framework's compose:dynlink host.
wasmtime = { version = "48.0.0", features = ["component-model", "cache"] }
# The extension store-state holds a WasiCtx and implements WasiView (components
# target wasip2). Same version as wasmtime.
wasmtime-wasi = "48.0.0"
# wasi:http host imports (types + outgoing-handler @0.2.9). Required because the
# composed cache.wasm imports wasi:http via the s3-wasm HTTPS transport; without
# this the extension linker rejects it with "matching implementation was not
# found". Same version as wasmtime. `add_only_http_to_linker_sync` avoids the
# double-add wasi:cli/filesystem/etc conflict with `wasmtime_wasi::p2::
# add_to_linker_sync` (see wasmtime-wasi-http/src/p2/mod.rs).
wasmtime-wasi-http = "48.0.0"
# The witcanon contract-digest scheme: sha256("witcanon:1" || canonical WIT
# bytes), byte-identical to compose-core::blobs::compute_wit_digest in
# ~/git/webassembly-component-orchestration so digests interoperate. build.rs
# computes the digest at build time; the lib just embeds + serves the const.
hex = "0.4"
# The shared runtime contract-version load guard, lifted from this crate's
# former inline `component_contract_major`/`check_component_contract` so the
# same guard backs both the ducklink and sqlink hosts (datalink is public).
# The witcanon CONTRACT_DIGEST (above) stays per-repo; this is the @MAJOR proxy.
datalink-contract = { git = "https://github.com/tegmentum/datalink.git", rev = "279f6743c85174c4b02f636a4205ce3ee2a8e644" }
# ADR-0029 Phase 6.1b — datalink-contract migrated its two introspection fns
# from `(&Engine, &Component, &str)` to `(&CompiledComponent, &str)` (wasmos
# migration doc: docs/design/runtime-abstraction/phase-6-1-component-metadata-
# introspection.md). This crate keeps its `(engine, component)`-taking public
# wrappers (500+ internal call sites at ducklink and downstream consumers)
# and bridges to the new datalink-contract API via a local
# `CompiledComponentImpl` wrapper struct in src/contract_guard_bridge.rs.
# When ducklink-runtime's own compile-side migrates to wasmos-runtime-api
# (a later phase), this dep continues to serve as the underlying opaque
# handle vocabulary; when the whole crate migrates, the bridge module
# retires.
wasmos-runtime-api = { git = "https://github.com/tegmentum/wasmos.git", rev = "93320c8e430015dd64d5a441f9205c483eea2311" }
# ADR-0029 Phase 6.2.h.2 — the v48 adapter's `sync_bridge` module
# is the SyncHostCall → wasmtime::component::Linker<S> bridge that
# lets us swap wit-bindgen `add_to_linker` calls for wasmos-native
# handler dispatch one interface at a time (Session-2 migrates the
# first interface: Lifecycle). Same rev as wasmos-runtime-api so the
# API shapes agree; keeps in lockstep with future bumps.
wasmos-runtime-wasmtime-v48 = { git = "https://github.com/tegmentum/wasmos.git", rev = "93320c8e430015dd64d5a441f9205c483eea2311" }
# The shared store-generic compose:dynlink/linker host machinery + the
# ResidentBackend (instantiate-once-and-reuse provider lifecycle). ducklink's
# compose_dynlink module is now a thin adapter over this; the resolve/invoke
# bridge + bindings live here, shared with the other wasm-component hosts.
datalink-dynlink = { git = "https://github.com/tegmentum/datalink.git", rev = "279f6743c85174c4b02f636a4205ce3ee2a8e644" }
# `PendingKind::iter()` is derived via `EnumIter` so `PendingKind::all()` stays
# in lockstep with the enum without a hand-maintained mirror array or a
# hardcoded variant-count assert. `strum` is stable-Rust (no nightly required)
# and pulls in `strum_macros` transitively via its `derive` feature.
strum = { version = "0.26", features = ["derive"] }
# fs2 provides the cross-platform `FileExt::lock_exclusive` / `try_lock_exclusive`
# used by the `duckdb:extension/file-lock` host import (the wasm-cache flock
# path). Matches the exact same crate the native duckdb-cache extension uses in
# `duckdb-cache/src/store.rs::UriLock`, so cache-component's lock semantics on
# wasm are byte-identical to the native's on macOS/Linux/Windows.
fs2 = "0.4"

[build-dependencies]
# Same witcanon scheme, used in build.rs to hash the canonical WIT into a const.
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
# #823 dedup smoke test (tests/dedup_postgis_provider.rs): encodes and
# decodes the compose:dynlink/endpoint CBOR envelope end-to-end against
# a real postgis-composed-provider artifact (mirrors the datafission
# reference at crates/df-plugin-loader/tests/dedup_postgis_provider.rs).
ciborium = "0.2"
serde_bytes = "0.11"
serde = { version = "1", features = ["derive"] }

[lib]
